<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyMind AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-dark: #4338CA;
            --secondary: #10B981;
            --secondary-dark: #059669;
            --danger: #EF4444;
            --warning: #F59E0B;
            --success: #10B981;
            --background: #F9FAFB;
            --surface: #FFFFFF;
            --text: #1F2937;
            --text-secondary: #6B7280;
            --border: #E5E7EB;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.5;
        }

        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeIn 0.5s ease-out;
        }

        .header h1 {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .card {
            background: var(--surface);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            gap: 0.5rem;
        }

        .button-primary {
            background-color: var(--primary);
            color: white;
        }

        .button-primary:hover {
            background-color: var(--primary-dark);
        }

        .button-secondary {
            background-color: var(--secondary);
            color: white;
        }

        .button-secondary:hover {
            background-color: var(--secondary-dark);
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text);
        }

        .input-field {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--border);
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease-out;
        }

        .modal-content {
            background: var(--surface);
            padding: 2rem;
            border-radius: 1rem;
            width: 90%;
            max-width: 600px;
            position: relative;
            animation: slideIn 0.3s ease-out;
        }

        .close-button {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .question-card {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 0.75rem;
            margin-bottom: 1.5rem;
            border: 2px solid var(--border);
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 1rem;
        }

        .options-grid {
            display: grid;
            gap: 1rem;
        }

        .option-button {
            padding: 1rem;
            border: 2px solid var(--border);
            border-radius: 0.5rem;
            background: var(--surface);
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .option-button:hover {
            border-color: var(--primary);
            background: #F3F4F6;
        }

        .option-button.selected {
            border-color: var(--primary);
            background: #EEF2FF;
        }

        .option-button.correct {
            border-color: var(--success);
            background: #ECFDF5;
        }

        .option-button.incorrect {
            border-color: var(--danger);
            background: #FEF2F2;
        }

        .result-summary {
            background: #F0FDF4;
            padding: 1.5rem;
            border-radius: 0.75rem;
            margin-top: 2rem;
        }

        .progress-bar {
            height: 0.5rem;
            background: var(--border);
            border-radius: 0.25rem;
            margin-top: 0.5rem;
        }

        .progress-fill {
            height: 100%;
            background: var(--success);
            border-radius: 0.25rem;
            transition: width 0.3s ease-out;
        }

        .file-upload {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-upload-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            border: 2px dashed var(--border);
            border-radius: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .file-upload-label:hover {
            border-color: var(--primary);
            background: #F3F4F6;
        }

        .file-upload input[type="file"] {
            position: absolute;
            width: 0;
            height: 0;
            opacity: 0;
        }

        .preview-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .preview-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 0.5rem;
            border: 2px solid var(--border);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .loader {
            display: none;
            width: 48px;
            height: 48px;
            border: 5px solid var(--border);
            border-bottom-color: var(--primary);
            border-radius: 50%;
            animation: rotation 1s linear infinite;
            margin: 2rem auto;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .app-container {
                padding: 1rem;
            }

            .header h1 {
                font-size: 2rem;
            }

            .modal-content {
                width: 95%;
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>StudyMind AI</h1>
            <p>Создавайте тесты из текста или изображений с помощью искусственного интеллекта</p>
        </header>

        <div class="card">
            <h2>Начать создание теста</h2>
            <p class="text-secondary">Выберите способ создания теста</p>
            <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
                <button class="button button-primary" onclick="showModal('textModal')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    Создать из текста
                </button>
                <button class="button button-secondary" onclick="showModal('imageModal')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                    Создать из изображения
                </button>
            </div>
        </div>

        <!-- Модальное окно для текста -->
        <div id="textModal" class="modal">
            <div class="modal-content">
                <button class="close-button" onclick="hideModal('textModal')">&times;</button>
                <h2>Создание теста из текста</h2>
                <div class="input-group">
                    <label for="textTitle">Название теста</label>
                    <input type="text" id="textTitle" class="input-field" placeholder="Введите название теста">
                </div>
                <div class="input-group">
                    <label for="textContent">Текст для генерации вопросов</label>
                    <textarea id="textContent" class="input-field" rows="6" placeholder="Введите или вставьте текст"></textarea>
                </div>
                <div class="input-group">
                    <label for="textQuestionCount">Количество вопросов</label>
                    <input type="number" id="textQuestionCount" class="input-field" min="1" max="10" value="5">
                </div>
                <button class="button button-primary" onclick="generateTextTest()">Создать тест</button>
            </div>
        </div>

        <!-- Модальное окно для изображения -->
        <div id="imageModal" class="modal">
            <div class="modal-content">
                <button class="close-button" onclick="hideModal('imageModal')">&times;</button>
                <h2>Создание теста из изображения</h2>
                <div class="input-group">
                    <label for="imageTitle">Название теста</label>
                    <input type="text" id="imageTitle" class="input-field" placeholder="Введите название теста">
                </div>
                <div class="input-group">
                    <div class="file-upload">
                        <label class="file-upload-label">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            <span style="margin-left: 0.5rem;">Выберите изображение или перетащите его сюда</span>
                        </label>
                        <input type="file" id="images" accept="image/*" multiple>
                    </div>
                    <div id="imagePreview" class="preview-container"></div>
                </div>
                <div class="input-group">
                    <label for="imageQuestionCount">Количество вопросов</label>
                    <input type="number" id="imageQuestionCount" class="input-field" min="1" max="10" value="5">
                </div>
                <button class="button button-primary" onclick="generateImageTest()">Создать тест</button>
            </div>
        </div>

        <div class="loader" id="loader"></div>
        <div id="result"></div>
    </div>

    <script>
        let currentTest = null;

        // Показать модальное окно
        function showModal(modalId) {
            document.getElementById(modalId).style.display = 'flex';
        }

        // Скрыть модальное окно
        function hideModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        // Закрытие модального окна при клике вне его
        window.onclick = function(event) {
            if (event.target.className === 'modal') {
                event.target.style.display = 'none';
            }
        }

        // Предварительный просмотр изображений
        document.getElementById('images').addEventListener('change', function(e) {
            const preview = document.getElementById('imagePreview');
            preview.innerHTML = '';

            Array.from(this.files).forEach(file => {
                if (!file.type.startsWith('image/')) {
                    alert('Пожалуйста, выберите изображение');
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = document.createElement('img');
                    img.src = event.target.result;
                    img.className = 'preview-image';
                    preview.appendChild(img);
                }
                reader.readAsDataURL(file);
            });
        });

        // Функционал Drag and Drop
        const dropZone = document.querySelector('.file-upload-label');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight() {
            dropZone.classList.add('drag-over');
            dropZone.style.borderColor = 'var(--primary)';
            dropZone.style.backgroundColor = '#F3F4F6';
        }

        function unhighlight() {
            dropZone.classList.remove('drag-over');
            dropZone.style.borderColor = 'var(--border)';
            dropZone.style.backgroundColor = 'transparent';
        }

        dropZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const files = e.dataTransfer.files;
            document.getElementById('images').files = files;
            const changeEvent = new Event('change');
            document.getElementById('images').dispatchEvent(changeEvent);
        }

        // Генерация теста из изображения
        async function generateImageTest() {
            const files = document.getElementById('images').files;
            const title = document.getElementById('imageTitle').value.trim();
            const questionCount = document.getElementById('imageQuestionCount').value;

            if (files.length === 0) {
                alert('Пожалуйста, выберите изображение');
                return;
            }
            if (!title) {
                alert('Пожалуйста, введите название теста');
                return;
            }

            showLoader();
            hideModal('imageModal');

            const formData = new FormData();
            formData.append('files', files[0]);
            formData.append('title', title);
            formData.append('num_questions', questionCount);

            try {
                const response = await fetch('http://127.0.0.1:8000/images/upload', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('Ошибка сервера');
                }

                const data = await response.json();
                hideLoader();
                displayResults(data);
            } catch (error) {
                hideLoader();
                showError('Произошла ошибка при создании теста: ' + error.message);
            }
        }

        // Генерация теста из текста
        async function generateTextTest() {
            const content = document.getElementById('textContent').value.trim();
            const title = document.getElementById('textTitle').value.trim();
            const questionCount = document.getElementById('textQuestionCount').value;

            if (!content || !title) {
                alert('Пожалуйста, заполните все поля');
                return;
            }

            showLoader();
            hideModal('textModal');

            try {
                const response = await fetch('http://127.0.0.1:8000/tests/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: title,
                        content: content,
                        num_questions: parseInt(questionCount)
                    })
                });

                if (!response.ok) {
                    throw new Error('Ошибка сервера');
                }

                const data = await response.json();
                hideLoader();
                displayResults(data);
            } catch (error) {
                hideLoader();
                showError('Произошла ошибка при создании теста: ' + error.message);
            }
        }

        // Управление UI состояниями
        function showLoader() {
            document.getElementById('loader').style.display = 'block';
        }

        function hideLoader() {
            document.getElementById('loader').style.display = 'none';
        }

        function showError(message) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `
                <div class="card" style="border: 2px solid var(--danger); background-color: #FEF2F2;">
                    <h3 style="color: var(--danger)">Ошибка</h3>
                    <p>${message}</p>
                </div>
            `;
        }

        // Отображение результатов теста
        function displayResults(data) {
            const resultDiv = document.getElementById('result');
            currentTest = data.test;

            let output = `
                <div class="card">
                    <h2>${data.test.title}</h2>
                    <form id="testForm">
            `;

            data.test.questions.forEach((q, i) => {
                output += `
                    <div class="question-card" id="question-${q.id}">
                        <p class="question-text">Вопрос ${i + 1}: ${q.text}</p>
                        <div class="options-grid">
                            ${q.options.map((opt, j) => `
                                <button type="button"
                                    class="option-button"
                                    onclick="selectOption(this, ${q.id}, '${opt}')"
                                    data-question="${q.id}"
                                    data-option="${opt}">
                                    ${String.fromCharCode(65 + j)}. ${opt}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            output += `
                    <button type="button" class="button button-primary" onclick="checkAnswers()" style="margin-top: 1rem;">
                        Завершить тест
                    </button>
                </form>
            </div>`;

            resultDiv.innerHTML = output;

            // Плавный скролл к результатам
            resultDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // Выбор варианта ответа
        function selectOption(button, questionId, option) {
            // Убираем выделение с других кнопок этого вопроса
            const options = document.querySelectorAll(`button[data-question="${questionId}"]`);
            options.forEach(opt => opt.classList.remove('selected'));

            // Выделяем выбранную кнопку
            button.classList.add('selected');

            // Анимация выбора
            button.style.transform = 'scale(0.98)';
            setTimeout(() => {
                button.style.transform = 'scale(1)';
            }, 100);
        }

        // Проверка ответов
        async function checkAnswers() {
            if (!currentTest) return;

            const answers = {};
            let unansweredQuestions = [];

            currentTest.questions.forEach((q, i) => {
                const selectedOption = document.querySelector(`.option-button.selected[data-question="${q.id}"]`);
                if (selectedOption) {
                    answers[q.id] = selectedOption.dataset.option;
                } else {
                    unansweredQuestions.push(i + 1);
                }
            });

            if (unansweredQuestions.length > 0) {
                alert(`Пожалуйста, ответьте на все вопросы!\nНе отвечены вопросы: ${unansweredQuestions.join(', ')}`);

                // Подсветка неотвеченных вопросов
                unansweredQuestions.forEach(qNum => {
                    const questionCard = document.querySelector(`#question-${qNum}`);
                    questionCard.style.border = '2px solid var(--warning)';
                    setTimeout(() => {
                        questionCard.style.border = '2px solid var(--border)';
                    }, 2000);
                });
                return;
            }

            let correctCount = 0;
            currentTest.questions.forEach((q) => {
                const userAnswer = answers[q.id];
                const isCorrect = userAnswer === q.correct_answer;
                if (isCorrect) correctCount++;

                const options = document.querySelectorAll(`button[data-question="${q.id}"]`);
                options.forEach(opt => {
                    if (opt.dataset.option === q.correct_answer) {
                        opt.classList.add('correct');
                    } else if (opt.dataset.option === userAnswer && !isCorrect) {
                        opt.classList.add('incorrect');
                    }
                    opt.disabled = true;
                });
            });

            const percentage = (correctCount / currentTest.questions.length) * 100;

            const resultSummary = `
                <div class="result-summary">
                    <h3>Результаты теста</h3>
                    <p>Правильных ответов: ${correctCount} из ${currentTest.questions.length}</p>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${percentage}%"></div>
                    </div>
                    <p style="margin-top: 1rem">Процент правильных ответов: ${percentage.toFixed(1)}%</p>
                    <button onclick="location.reload()" class="button button-secondary" style="margin-top: 1rem">
                        Создать новый тест
                    </button>
                </div>
            `;

            const summaryElement = document.createElement('div');
            summaryElement.innerHTML = resultSummary;
            document.getElementById('testForm').appendChild(summaryElement);

            // Плавный скролл к результатам
            summaryElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    </script>
</body>
</html>
